<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday poduu 💜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom right, #6a0dad, #c084fc);
            overflow: hidden;
            color: #fff;
            text-align: center;
        }

        section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #flowerCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #friend-name {
            font-size: 3rem;
            font-weight: bold;
            color: #ffd6ff;
            z-index: 2;
        }

        .hidden {
            display: none;
        }

        #quiz {
            flex-direction: column;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1rem;
        }

        .question {
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .choice {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            margin: 0.4rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .choice:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        #cake {
            position: relative;
            flex-direction: column;
        }

        .cake {
            position: relative;
            width: 320px;
            height: 240px;
            background: #fff0f5;
            border-radius: 0 0 50px 50px;
            margin-bottom: 2rem;
            box-shadow: inset 0 -10px 0 #ff69b4;
        }

        .layer {
            position: absolute;
            left: 0;
            width: 100%;
            height: 70px;
            border-radius: 20px 20px 0 0;
            background: #ffb6c1;
            box-shadow: inset 0 -10px 0 #ff69b4;
        }

        .layer:nth-child(2) {
            top: 70px;
            background: #ffc0cb;
        }

        .layer:nth-child(3) {
            top: 140px;
            background: #ff99cc;
        }

        .candle {
            width: 25px;
            height: 60px;
            background: #fff;
            position: absolute;
            top: -60px;
            border-radius: 5px;
            cursor: pointer;
        }

        .flame {
            width: 12px;
            height: 18px;
            background: radial-gradient(circle, #ff0 30%, transparent 70%);
            border-radius: 50%;
            position: absolute;
            top: -18px;
            left: 6px;
            animation: flicker 0.2s infinite alternate;
        }

        @keyframes flicker {
            from {
                transform: scale(1);
                opacity: 1;
            }

            to {
                transform: scale(0.8);
                opacity: 0.6;
            }
        }

        #final-message {
            font-size: 2rem;
            margin-top: 2rem;
            opacity: 0;
            transition: opacity 1s;
        }

        #tap-msg {
            font-size: 1.2rem;
            margin-top: 1rem;
            color: #ffe6ff;
        }
    </style>
</head>

<body>
    <audio id="bg-music" autoplay loop>
        <source src="assets/guitar.mp3" type="audio/mpeg" />
    </audio>

    <section id="flowers">
        <canvas id="flowerCanvas"></canvas>
        <h1 id="friend-name">Sisuuu</h1>
        <h2>Wishing You a Wonderful Birthday! 💜</h2>
    </section>

    <section id="quiz" class="hidden">
        <h2>Fun Birthday Quiz 🎉</h2>
        <div class="question" id="question"></div>
        <div id="choices"></div>
        <div id="result"></div>
    </section>

    <section id="cake" class="hidden">
        <div class="cake">
            <div class="layer"></div>
            <div class="layer"></div>
            <div class="layer"></div>
            <div class="candle" style="left:50px;">
                <div class="flame"></div>
            </div>
            <div class="candle" style="left:120px;">
                <div class="flame"></div>
            </div>
            <div class="candle" style="left:190px;">
                <div class="flame"></div>
            </div>
            <div class="candle" style="left:260px;">
                <div class="flame"></div>
            </div>
        </div>
        <div id="tap-msg">🎂 Tap the candles to blow them out!</div>
        <div id="final-message">Happy Birthday, <span id="name-display">Sisuuu</span>! 🎉💜</div>
    </section>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Flower {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.size = 0; this.maxSize = Math.random() * 40 + 20; this.growth = 0.4;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                for (let i = 0; i < 6; i++) {
                    ctx.rotate(Math.PI / 3);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(this.size / 2, -this.size, this.size, 0);
                    ctx.quadraticCurveTo(this.size / 2, this.size, 0, 0);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                ctx.restore();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size / 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffff99';
                ctx.fill();
            }
            update() {
                if (this.size < this.maxSize) {
                    this.size += this.growth;
                    this.draw();
                } else this.draw();
            }
        }

        const flowers = [];
        for (let i = 0; i < 30; i++) {
            let x = Math.random() * canvas.width;
            let y = Math.random() * canvas.height;
            let color = `hsl(${Math.random() * 360},70%,70%)`;
            flowers.push(new Flower(x, y, color));
        }

        function animateBloom() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            flowers.forEach(f => f.update());
            requestAnimationFrame(animateBloom);
        }
        animateBloom();

        setTimeout(() => {
            document.getElementById('flowers').classList.add('hidden');
            document.getElementById('quiz').classList.remove('hidden');
            loadQuestion();
        }, 7000);

        const QUESTIONS = [
            { q: 'In this day what is special ?', choices: ['You born', 'Childrens Day', 'You landed in earth', 'all '], a: 3 },
            { q: 'why are you creating so much jhamela ?', choices: ['hobby', 'talent', 'satisfaction', 'as per mood'], a: 1 },
            { q: 'what is your favorite thing?', choices: ['hot garlic chicken', 'puku', 'mix fried rice', 'sexy dresses'], a: 1 },
            { q: 'Best thing in You?', choices: ['petuu', 'duduu', 'poduu', 'All'], a: 3 }
        ];

        let qIndex = 0, score = 0;
        function loadQuestion() {
            if (qIndex < QUESTIONS.length) {
                const q = QUESTIONS[qIndex];
                document.getElementById('question').textContent = q.q;
                const choicesDiv = document.getElementById('choices');
                choicesDiv.innerHTML = '';
                q.choices.forEach((c, i) => {
                    const btn = document.createElement('button');
                    btn.textContent = c; btn.className = 'choice';
                    btn.onclick = () => { if (i === q.a) score++; qIndex++; loadQuestion(); };
                    choicesDiv.appendChild(btn);
                });
            } else {
                document.getElementById('quiz').innerHTML = `<h2>You scored ${score}/4! 🎉</h2>`;
                setTimeout(() => {
                    document.getElementById('quiz').classList.add('hidden');
                    document.getElementById('cake').classList.remove('hidden');
                }, 3000);
            }
        }

        const candles = document.querySelectorAll('.candle');
        let blown = 0;
        candles.forEach(c => {
            c.addEventListener('click', () => {
                const f = c.querySelector('.flame');
                if (f) f.remove();
                blown++;
                if (blown === candles.length) {
                    document.getElementById('final-message').style.opacity = 1;
                    dropConfetti();
                }
            });
        });

        function dropConfetti() {
            for (let i = 0; i < 100; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'fixed';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10px';
                conf.style.width = '8px'; conf.style.height = '8px';
                conf.style.background = `hsl(${Math.random() * 360},100%,50%)`;
                conf.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                conf.style.borderRadius = '50%';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 4000);
            }
        }

        const style = document.createElement('style');
        style.innerHTML = '@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0;}}';
        document.head.appendChild(style);
    </script>
</body>

</html>
